name: build

on:
  push:
    branches: ["**"]   # every branch, including main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Runs go test inside the Dockerfile's build stage, then builds the amd64 image.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: hello-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name hs -p 8080:8080 -e APP_ENV=ci hello-service:${{ github.sha }}
          for i in $(seq 1 10); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/info
          docker rm -f hs
