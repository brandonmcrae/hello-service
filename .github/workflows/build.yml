name: build

on:
  push:
    branches: ["**"]   # every branch, including main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token to assume the AWS push role
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.push.outputs.image }}   # repo@sha256:..., for deploy jobs
    steps:
      - uses: actions/checkout@v5

      # Version = commit. ECR tags are immutable, so one commit maps to one image forever.
      - name: Image tag
        id: meta
        run: |
          tag="sha-${GITHUB_SHA::7}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=${ECR_REPOSITORY_URL}:${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # Runs go test inside the Dockerfile's build stage, then builds the amd64 image.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name hs -p 8080:8080 -e APP_ENV=ci "${{ steps.meta.outputs.ref }}"
          for _ in $(seq 1 10); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/info
          docker rm -f hs

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # Push the exact image that passed the smoke test. A re-run for the same
      # commit finds the tag already there and reuses it, since an immutable
      # tag can't be pushed twice.
      - name: Push to ECR
        id: push
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          REF: ${{ steps.meta.outputs.ref }}
        run: |
          repo="${ECR_REPOSITORY_URL#*/}"
          if aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$TAG" >/dev/null 2>&1; then
            echo "$TAG already in ECR; skipping push"
          else
            docker push "$REF"
          fi
          digest=$(aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$TAG" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "image=${ECR_REPOSITORY_URL}@${digest}" >> "$GITHUB_OUTPUT"
          echo "Pushed \`${REF}\` (\`${digest}\`)" >> "$GITHUB_STEP_SUMMARY"
